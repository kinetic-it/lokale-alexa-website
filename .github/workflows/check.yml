name: Prüfung

on:
  pull_request:
  push:
    branches: [main]

jobs:
  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Zweisprachigkeit, Quellen und generierte Seitenteile prüfen
        run: python3 tools/check_i18n.py
