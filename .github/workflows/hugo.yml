name: Hugo

# Baut die Seite mit festgelegter Hugo-Version und beweist, dass sie der bisherigen Seite entspricht
# (tools/hugo_parity.py). Veröffentlicht wird nur, wenn in den Repository-Einstellungen unter
# Pages die Quelle auf "GitHub Actions" steht UND die Variable PAGES_VIA_ACTIONS auf "true" gesetzt ist.
# Solange das nicht der Fall ist, liefert GitHub Pages weiter die Dateien aus dem Hauptordner aus.
# Beim Umstellen: index.html, en/index.html, feed.xml, sitemap.xml und die Python-Generatoren entfernen
# und den Vergleichsschritt streichen.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hugo-${{ github.ref }}
  cancel-in-progress: true

env:
  # Prüfsumme aus der offiziellen Datei hugo_<Version>_checksums.txt des Releases (hugo_*_linux-amd64.tar.gz, ohne extended).
  HUGO_VERSION: "0.169.0"
  HUGO_SHA256: "2d2f0bfe357d8cb4cec02f6bb28a3bff34978c8dda44b618029c5eb9d66765a7"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Hugo installieren (festgelegte Version, Prüfsumme geprüft)
        run: |
          curl -fsSL -o hugo.tgz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HUGO_SHA256}  hugo.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/hugo"
          tar -xzf hugo.tgz -C "$HOME/.local/hugo" hugo
          echo "$HOME/.local/hugo" >> "$GITHUB_PATH"
      - name: Seite bauen
        run: hugo version && hugo --destination public
      - name: Mit der bisherigen Seite vergleichen
        run: python3 tools/hugo_parity.py public
      - name: Für Pages bereitstellen
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PAGES_VIA_ACTIONS == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PAGES_VIA_ACTIONS == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
